[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhirewalk"
version = "0.1.0"
description = "Hierarchy-to-hierarchy RTL connectivity / COI knowledge graph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
slang = ["pyslang>=9.0"]

[project.scripts]
pyhirewalk = "pyhirewalk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
